<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="블로그마스터" />
<meta name="theme-color" content="#c4704b" />
<title>블로그마스터</title>
<style>
:root{--br:#8a4b32;--tc:#c4704b;--bg:#faf8f5;--w:#fff;--cream:#efe7df;--sand:#e0d3c7;--wg:#8b7d70;--lg:#b8a99b;--sg:#7a8b6f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:#2c2420;line-height:1.7;padding-bottom:40px}
header{background:var(--tc);color:#fff;padding:16px 18px;position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.wrap{max-width:640px;margin:0 auto;padding:16px}
label{display:block;font-size:13px;font-weight:600;color:var(--br);margin:16px 0 6px}
.hint{font-weight:400;color:var(--wg);font-size:12px}
input,textarea,select{width:100%;padding:13px;border:1.5px solid var(--sand);border-radius:12px;font-size:16px;font-family:inherit;background:var(--w);color:inherit}
textarea{min-height:110px;resize:vertical}
.seg{display:flex;gap:8px;margin-top:6px}
.seg button{flex:1;padding:11px;border:1.5px solid var(--sand);border-radius:12px;background:var(--w);color:var(--wg);font-size:14px;font-weight:600}
.seg button.on{background:var(--tc);color:#fff;border-color:var(--tc)}
.btn{width:100%;padding:15px;border:none;border-radius:12px;background:var(--tc);color:#fff;font-size:16px;font-weight:700;margin-top:20px}
.btn:disabled{opacity:.55}
.btn.sec{background:var(--w);color:var(--br);border:1.5px solid var(--sand)}
.card{background:var(--w);border:1px solid var(--cream);border-radius:14px;padding:16px;margin-top:16px;white-space:pre-wrap;word-break:keep-all;font-size:15px}
.status{text-align:center;color:var(--wg);font-size:13px;margin-top:16px;min-height:20px}
.status.warn{color:#805d18}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--cream);border-top-color:var(--tc);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.hidden{display:none}
.copybar{display:flex;gap:8px;margin-top:12px}
.copybar button{flex:1;padding:11px;border:1.5px solid var(--sand);border-radius:10px;background:var(--w);color:var(--br);font-size:13px;font-weight:600}
.tag{display:inline-block;background:rgba(196,112,75,.1);color:var(--br);padding:2px 8px;border-radius:6px;font-size:11px;margin:2px}
</style>
</head>
<body>
<header>📝 블로그마스터 <span style="flex:1"></span><button onclick="toggleHistory()" style="background:rgba(255,255,255,.2);border:none;color:#fff;font-size:13px;padding:7px 12px;border-radius:10px;font-weight:600">📋 지난 글</button></header>
<div class="wrap">

  <!-- 지난 글 목록 -->
  <div id="stepHistory" class="hidden">
    <div style="font-size:13px;color:var(--wg);margin:8px 0">최근 만든 글 (탭하면 전체 보기)</div>
    <div id="historyList"></div>
    <button class="btn sec" onclick="closeHistory()" style="margin-top:12px">← 새 글 쓰기로</button>
  </div>


  <!-- 입력 -->
  <div id="stepInput">
    <label>주제 / 키워드 <span class="hint">예: 제주 애월 오션뷰 카페</span></label>
    <input id="kw" placeholder="어떤 곳을 다녀오셨나요?" />
    <label>경험 메모 <span class="hint">간단해도 OK</span></label>
    <textarea id="memo" placeholder="예)&#10;- 주말에 딸이랑 방문&#10;- 통유리 뷰가 좋았음&#10;- 주차 넉넉"></textarea>
    <label>글 유형</label>
    <div class="seg" id="typeSeg">
      <button class="on" data-t="내돈내산">내돈내산</button>
      <button data-t="체험단">체험단</button>
    </div>
    <button class="btn" id="btnStep1" onclick="submitStep1()">① 검색 + 추가 질문 받기</button>
  </div>

  <!-- 추가질문 + 답변 -->
  <div id="stepQ" class="hidden">
    <div class="card" id="questions"></div>
    <label>💬 추가 답변 <span class="hint">위 질문에 답할수록 좋은 글이 나와요</span></label>
    <textarea id="answer" style="min-height:150px" placeholder="질문에 대한 답을 적어주세요"></textarea>
    <label style="display:flex;align-items:center;gap:10px;margin-top:16px">
      <input type="checkbox" id="autoUpload" checked style="width:22px;height:22px">
      <span>maymooon에 <b>비공개로 자동 저장</b> (네이버 앱에서 사진 넣고 발행)</span>
    </label>
    <button class="btn" id="btnStep2" onclick="submitStep2()">② 블로그 글 완성하기</button>
  </div>

  <!-- 결과 -->
  <div id="stepResult" class="hidden">
    <div class="copybar">
      <button onclick="copyAll()">📋 전체 복사</button>
      <button onclick="reset()">✍️ 새 글</button>
    </div>
    <div class="card" id="result"></div>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
const FB = "https://sdgc-ae7f9-default-rtdb.asia-southeast1.firebasedatabase.app";
const NODE = "blogmaster/requests";
let wtype = "내돈내산", lastInputs = {};

document.querySelectorAll('#typeSeg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#typeSeg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); wtype=b.dataset.t;
});

function setStatus(msg, busy=false, warning=false){
  const el=document.getElementById('status');
  el.classList.toggle('warn',!!warning);
  el.replaceChildren();
  if(busy){const spin=document.createElement('span');spin.className='spin';el.appendChild(spin);}
  if(msg)el.append(document.createTextNode(String(msg)));
}
function showBusinessInfo(info, prefix=''){
  if(!info||typeof info!=='object'||!info.message)return false;
  setStatus(prefix+String(info.message),false,info.status==='needs_info');
  return true;
}
function historyBusinessLabel(info){return info&&info.status==='needs_info'?' · 업체정보 확인 대기':'';}
function showTerminalStatus(req, prefix=''){
  const info=req&&req.businessInfo;
  if(info&&info.status==='needs_info')return showBusinessInfo(info,prefix);
  const base=info&&info.message?prefix+String(info.message):prefix;
  const join=(message)=>base?base+' · '+message:message;
  if(req&&req.upload_status==='needs_info'){setStatus(join('업체정보 확인 대기: '+(req.upload_msg||'확인 후 비공개 저장을 진행합니다.')),false,true);return true;}
  if(req&&req.upload_status==='pending_approval'){setStatus(join('승인 대기: '+(req.upload_msg||'maymooon 비공개 저장 승인을 기다리고 있어요.')));return true;}
  if(req&&req.upload_status==='login_needed'){setStatus(join('로그인 필요: '+(req.upload_msg||'maymooon 로그인이 필요해요.')));return true;}
  if(req&&req.upload_status==='error'){setStatus(join('저장 실패: '+(req.upload_msg||'아래 글은 그대로 복사할 수 있어요.')));return true;}
  return showBusinessInfo(info,prefix);
}

async function fbPut(path, data){
  await fetch(`${FB}/${path}.json`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
}
async function fbGet(path){
  const r = await fetch(`${FB}/${path}.json`); const t = await r.text();
  return (t && t!=='null') ? JSON.parse(t) : null;
}

// 요청 제출 후 결과가 나올 때까지 폴링
async function runRequest(payload){
  const rid = 'r'+Date.now()+Math.floor(Math.random()*1000);
  window._lastRid = rid;
  payload.status='pending'; payload.created=Date.now();
  await fbPut(`${NODE}/${rid}`, payload);
  // 복구용: 진행중 요청을 기억(화면 꺼져 폴링 멈춰도 다시 열면 이어받음)
  localStorage.setItem('bm_rid', rid);
  localStorage.setItem('bm_kind', payload.step===2?'result':'questions');
  return await pollUntilDone(rid);
}

// status가 done/error 될 때까지 폴링(화면 복귀 시 재호출로 이어받기 가능)
async function pollUntilDone(rid){
  for(let i=0;i<300;i++){
    await new Promise(r=>setTimeout(r, 3000));
    const req = await fbGet(`${NODE}/${rid}`);
    if(!req) continue;
    window._lastRequest=req;
    if(req.progress) setStatus(req.progress, true);
    if(req.status==='done'){ return req.content||''; }
    if(req.status==='error') throw new Error(req.error||'생성 오류');
  }
  throw new Error('시간 초과 — 맥 워커가 켜져 있는지 확인하세요');
}

// 앱 다시 열면: 아까 만들던 글이 완성돼 있는지 확인해 복구
async function recoverLast(){
  const rid = localStorage.getItem('bm_rid');
  if(!rid) return;
  const req = await fbGet(`${NODE}/${rid}`);
  if(!req) return;
  window._lastRequest=req;
  const kind = localStorage.getItem('bm_kind');
  if(req.status==='done' && req.content){
    if(kind==='result'){
      window._lastRid = rid;
      document.getElementById('result').textContent = req.content;
      document.getElementById('stepInput').classList.add('hidden');
      document.getElementById('stepQ').classList.add('hidden');
      document.getElementById('stepResult').classList.remove('hidden');
      if(!showTerminalStatus(req,'(복구됨) '))setStatus('✅ (복구됨) 아까 만든 글이에요 — 전체 복사해서 쓰세요');
    } else {
      document.getElementById('questions').textContent = req.content;
      lastInputs = req.inputs || {};
      document.getElementById('stepInput').classList.add('hidden');
      document.getElementById('stepQ').classList.remove('hidden');
      setStatus('✅ (복구됨) 추가 질문이에요');
    }
  } else if(req.status==='pending' || req.status==='processing'){
    // 아직 생성 중이면 이어서 폴링
    setStatus('아까 만들던 글 이어받는 중...', true);
    window._lastRid = rid;
    try{
      const out = await pollUntilDone(rid);
      document.getElementById('result').textContent = out;
      document.getElementById('stepInput').classList.add('hidden');
      document.getElementById('stepResult').classList.remove('hidden');
      if(!showBusinessInfo(window._lastRequest&&window._lastRequest.businessInfo))setStatus('✅ 완성!');
    }catch(e){ setStatus('⚠️ '+e.message); }
  }
}

async function submitStep1(){
  const kw=document.getElementById('kw').value.trim();
  const memo=document.getElementById('memo').value.trim();
  if(!kw && !memo){ setStatus('주제나 메모를 입력해주세요'); return; }
  lastInputs={keyword:kw, memo:memo, type:wtype};
  document.getElementById('btnStep1').disabled=true;
  setStatus('검색하고 질문을 만드는 중... (30초~1분)', true);
  try{
    const out = await runRequest({tab:'write', step:1, inputs:lastInputs});
    document.getElementById('questions').textContent = out;
    document.getElementById('stepInput').classList.add('hidden');
    document.getElementById('stepQ').classList.remove('hidden');
    setStatus('');
  }catch(e){ setStatus('⚠️ '+e.message); }
  document.getElementById('btnStep1').disabled=false;
}

async function submitStep2(){
  const answer=document.getElementById('answer').value.trim();
  const autoUpload=document.getElementById('autoUpload').checked;
  const inputs={...lastInputs, answer:answer};
  document.getElementById('btnStep2').disabled=true;
  setStatus('블로그 글을 쓰는 중... (2~5분, 화면 꺼져도 됨)', true);
  try{
    const out = await runRequest({tab:'write', step:2, inputs:inputs, autoUpload:autoUpload});
    const rid = window._lastRid;
    document.getElementById('result').textContent = out;
    document.getElementById('stepQ').classList.add('hidden');
    document.getElementById('stepResult').classList.remove('hidden');
    const request=window._lastRequest||{};
    if(request.businessInfo&&request.businessInfo.status==='needs_info'){
      showTerminalStatus(request);
      return;
    }
    // 글은 이미 완성/표시됨(안전). 비공개 저장은 그 위에 얹는 단계라 상태만 폴링.
    if(autoUpload){
      setStatus('✅ 글 완성! maymooon에 비공개 저장 중...', true);
      for(let i=0;i<60;i++){
        await new Promise(r=>setTimeout(r,3000));
        const latest=await fbGet(`${NODE}/${rid}`)||{};
        window._lastRequest=latest;
        const us=latest.upload_status;
        const msg=latest.upload_msg;
        if(us==='needs_info'){ setStatus('⚠️ '+(msg||'업체정보 확인 대기: 확인 후 비공개 저장을 진행합니다.'),false,true); break; }
        if(us==='uploaded'){ setStatus('✅ '+(msg||'maymooon에 비공개 저장됨')); break; }
        if(us==='pending_approval'){ setStatus('승인 대기: '+(msg||'maymooon 비공개 저장 승인을 기다리고 있어요. 아래 글은 그대로 복사할 수 있어요.')); break; }
        if(us==='login_needed'){ setStatus('⚠️ '+(msg||'maymooon 로그인 필요') + ' (아래 글은 그대로 복사 가능)'); break; }
        if(us==='error'){ setStatus('⚠️ '+(msg||'저장 실패') + ' (아래 글 복사해서 쓰세요)'); break; }
      }
    } else {
      if(!showBusinessInfo(request.businessInfo))setStatus('✅ 완성! 전체 복사해서 네이버에 붙여넣으세요');
    }
  }catch(e){ setStatus('⚠️ '+e.message + ' (맥 워커 확인)'); }
  finally{ document.getElementById('btnStep2').disabled=false; }
}

function copyAll(){
  const t=document.getElementById('result').textContent;
  navigator.clipboard.writeText(t).then(()=>setStatus('📋 복사됐어요'));
}
function reset(){
  document.getElementById('stepResult').classList.add('hidden');
  document.getElementById('stepInput').classList.remove('hidden');
  document.getElementById('kw').value=''; document.getElementById('memo').value='';
  document.getElementById('answer').value=''; setStatus('');
}

/* ===== 지난 글 ===== */
async function toggleHistory(){
  const h=document.getElementById('stepHistory');
  if(!h.classList.contains('hidden')){ closeHistory(); return; }
  ['stepInput','stepQ','stepResult'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  h.classList.remove('hidden');
  document.getElementById('historyList').innerHTML='<div class="status"><span class="spin"></span> 불러오는 중...</div>';
  const all = await fbGet(NODE) || {};
  const items = Object.entries(all)
    .filter(([id,r])=>r && r.tab==='write' && r.step===2 && r.status==='done' && r.content)
    .sort((a,b)=>(b[1].created||0)-(a[1].created||0)).slice(0,30);
  if(!items.length){ document.getElementById('historyList').innerHTML='<div class="status">아직 만든 글이 없어요</div>'; return; }
  let html='';
  items.forEach(([id,r])=>{
    const title=((r.content.match(/【\s*1\s*위\s*】\s*([^\n—\-]+)/)||[])[1]) || (r.inputs&&r.inputs.keyword) || '제목없음';
    const d=r.created?new Date(r.created).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
    html+=`<div onclick="showHistoryItem('${id}')" style="padding:14px;background:var(--w);border:1px solid var(--cream);border-radius:12px;margin-bottom:8px"><div style="font-size:14px;font-weight:600;color:var(--br)">${escapeHtml(title.trim().slice(0,40))}</div><div style="font-size:11px;color:var(--lg);margin-top:3px">${d}${historyBusinessLabel(r.businessInfo)}</div></div>`;
  });
  document.getElementById('historyList').innerHTML=html;
}
async function showHistoryItem(id){
  const r=await fbGet(`${NODE}/${id}`);
  if(!r||!r.content)return;
  window._lastRid=id;
  document.getElementById('result').textContent=r.content;
  document.getElementById('stepHistory').classList.add('hidden');
  document.getElementById('stepResult').classList.remove('hidden');
  if(!showTerminalStatus(r))setStatus(r.upload_status?('저장상태: '+(r.upload_msg||r.upload_status)):'' );
}
function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function closeHistory(){
  document.getElementById('stepHistory').classList.add('hidden');
  document.getElementById('stepResult').classList.add('hidden');
  document.getElementById('stepQ').classList.add('hidden');
  document.getElementById('stepInput').classList.remove('hidden');
}
// 앱 열릴 때: 아까 만들던 글 자동 복구
window.addEventListener('load', ()=>{ try{ recoverLast(); }catch(e){} });
</script>
</body>
</html>
